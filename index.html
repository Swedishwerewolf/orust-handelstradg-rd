<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orust Handelsträdgård | Växter, Trädgård & Inspiration på Orust</title>
    <meta name="description" content="Välkommen till Orust Handelsträdgård – din lokala trädgård på västkusten för växter, blommor, buskar och trädgårdsinspiration.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --forest-green: #143122;
            --deep-green: #1b3a2b;
            --sage-green: #4a6b5d;
            --light-sage: #8fa398;
            --cream: #f4f0ea;
            --warm-white: #faf9f6;
            --gold: #c5a059;
            --gold-light: #dfc288;
            --charcoal: #222222;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--cream);
            color: var(--charcoal);
            overflow-x: hidden;
            line-height: 1.7;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: var(--forest-green);
        }

        /* Header & Navigation */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 5%;
            background: rgba(27, 58, 43, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(197, 160, 89, 0.2);
            transition: var(--transition);
        }

        header.scrolled {
            padding: 0.8rem 5%;
            background: rgba(20, 49, 34, 0.95);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
        }

        .logo-badge {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--cream);
            border: 2px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .logo-badge svg {
            width: 100%;
            height: 100%;
        }

        .brand-title {
            color: var(--cream);
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            letter-spacing: 0.05em;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .lang-switch {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--cream);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .lang-switch:hover {
            background: var(--gold);
            color: var(--forest-green);
        }

        /* Cinematic 3D Parallax Hero Section */
        .hero {
            position: relative;
            height: 100vh;
            width: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--cream);
        }

        .parallax-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            will-change: transform;
            pointer-events: none;
        }

        .layer-bg {
            background: linear-gradient(rgba(20, 49, 34, 0.4), rgba(20, 49, 34, 0.6)), url('https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?auto=format&fit=crop&w=2000&q=80') no-repeat center center/cover;
            z-index: 1;
            transform: scale(1.1);
        }

        .layer-mid {
            background: url('https://images.unsplash.com/photo-1530836369250-ef72a3f5cda8?auto=format&fit=crop&w=2000&q=80') no-repeat center center/cover;
            opacity: 0.35;
            mix-blend-mode: overlay;
            z-index: 2;
        }

        .layer-fog {
            background: radial-gradient(circle, rgba(27,58,43,0) 40%, rgba(20,49,34,0.8) 90%);
            z-index: 3;
        }

        .hero-content {
            position: relative;
            z-index: 10;
            max-width: 800px;
            padding: 0 2rem;
            transform: translateY(0);
            transition: transform 0.5s ease-out;
        }

        .hero-subtitle {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--gold-light);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .hero h1 {
            font-size: clamp(3rem, 6vw, 5.5rem);
            color: var(--cream);
            line-height: 1.1;
            margin-bottom: 1.5rem;
            text-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .hero p {
            font-size: clamp(1.1rem, 2vw, 1.35rem);
            margin-bottom: 2.5rem;
            color: rgba(244, 240, 234, 0.9);
            font-weight: 300;
        }

        .btn-primary {
            display: inline-block;
            background-color: var(--gold);
            color: var(--forest-green);
            padding: 1rem 2.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            letter-spacing: 0.05em;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: var(--transition);
            border: 2px solid var(--gold);
        }

        .btn-primary:hover {
            background-color: transparent;
            color: var(--gold);
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .scroll-indicator {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--cream);
            opacity: 0.8;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0) translateX(-50%);}
            40% {transform: translateY(-10px) translateX(-50%);}
            60% {transform: translateY(-5px) translateX(-50%);}
        }

        /* Main Sections Layout */
        section {
            padding: 7rem 10%;
        }

        .section-header {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 5rem auto;
        }

        .section-header span {
            color: var(--gold);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-size: 0.85rem;
            display: block;
            margin-bottom: 0.75rem;
        }

        .section-header h2 {
            font-size: clamp(2.2rem, 4vw, 3.5rem);
            color: var(--forest-green);
            line-height: 1.2;
        }

        /* About / Story Section */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .about-text h3 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: var(--forest-green);
        }

        .about-text p {
            margin-bottom: 1.5rem;
            color: #555;
            font-size: 1.05rem;
        }

        .about-features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .feature-item {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }

        .feature-item i {
            color: var(--gold);
            font-size: 1.5rem;
            margin-top: 0.2rem;
        }

        .feature-item h4 {
            font-size: 1.1rem;
            margin-bottom: 0.2rem;
        }

        .feature-item p {
            font-size: 0.9rem;
            color: #666;
            margin: 0;
        }

        /* Image Carousel / Gallery Section */
        .carousel-container {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            height: 450px;
        }

        .carousel-track {
            display: flex;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .carousel-slide {
            min-width: 100%;
            height: 100%;
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(27, 58, 43, 0.7);
            color: var(--cream);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: var(--transition);
        }

        .carousel-btn:hover {
            background: var(--gold);
            color: var(--forest-green);
        }

        .carousel-btn.prev { left: 20px; }
        .carousel-btn.next { right: 20px; }

        /* Plant Collections Gallery */
        .gallery-section {
            background-color: var(--deep-green);
            color: var(--cream);
        }

        .gallery-section .section-header h2 {
            color: var(--cream);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .gallery-card {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            height: 380px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .gallery-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .gallery-card:hover img {
            transform: scale(1.1);
        }

        .gallery-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 2.5rem 2rem 2rem 2rem;
            background: linear-gradient(transparent, rgba(20, 49, 34, 0.95));
            transform: translateY(20px);
            transition: var(--transition);
        }

        .gallery-card:hover .gallery-overlay {
            transform: translateY(0);
        }

        .gallery-overlay h3 {
            color: var(--cream);
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .gallery-overlay p {
            color: var(--gold-light);
            font-size: 0.95rem;
            margin: 0;
        }

        /* Video Section */
        .video-section {
            padding: 5rem 10%;
            background-color: var(--warm-white);
            text-align: center;
        }

        .video-wrapper {
            position: relative;
            max-width: 1000px;
            margin: 0 auto;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            height: 500px;
        }

        .video-wrapper video, .video-wrapper iframe {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* FAQ Section */
        .faq-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .faq-item {
            background: var(--warm-white);
            border-radius: 12px;
            margin-bottom: 1.5rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 1px solid rgba(197, 160, 89, 0.2);
            overflow: hidden;
            transition: var(--transition);
        }

        .faq-question {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            color: var(--forest-green);
            font-weight: 700;
        }

        .faq-question i {
            transition: transform 0.3s ease;
            color: var(--gold);
        }

        .faq-item.active .faq-question i {
            transform: rotate(180deg);
        }

        .faq-answer {
            max-height: 0;
            overflow: hidden;
            padding: 0 2rem;
            transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), padding 0.4s ease;
            color: #555;
        }

        .faq-item.active .faq-answer {
            max-height: 200px;
            padding: 0 2rem 1.5rem 2rem;
        }

        /* Contact Section */
        .contact-section {
            background-color: var(--forest-green);
            color: var(--cream);
        }

        .contact-section .section-header h2 {
            color: var(--cream);
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
        }

        .contact-info-card {
            background: rgba(255,255,255,0.05);
            padding: 3rem;
            border-radius: 20px;
            border: 1px solid rgba(197, 160, 89, 0.3);
        }

        .contact-info-item {
            display: flex;
            align-items: flex-start;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .contact-info-item i {
            font-size: 1.5rem;
            color: var(--gold);
            margin-top: 0.2rem;
        }

        .contact-info-item h4 {
            color: var(--cream);
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
        }

        .contact-info-item p {
            color: rgba(244, 240, 234, 0.8);
            font-size: 0.95rem;
        }

        .map-container {
            border-radius: 20px;
            overflow: hidden;
            height: 100%;
            min-height: 400px;
            border: 1px solid rgba(197, 160, 89, 0.3);
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Footer */
        footer {
            background-color: #0e2419;
            color: var(--cream);
            padding: 4rem 10% 2rem 10%;
            border-top: 1px solid rgba(197, 160, 89, 0.2);
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .social-links {
            display: flex;
            gap: 1.5rem;
        }

        .social-links a {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--gold);
            color: var(--cream);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: var(--transition);
        }

        .social-links a:hover {
            background: var(--gold);
            color: var(--forest-green);
            transform: translateY(-3px);
        }

        .footer-bottom {
            text-align: center;
            padding-top: 2rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: rgba(244, 240, 234, 0.6);
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .back-to-top {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--cream);
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-to-top:hover {
            background: var(--gold);
            color: var(--forest-green);
        }

        /* Empty States */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: var(--warm-white);
            border-radius: 16px;
            border: 2px dashed rgba(197, 160, 89, 0.3);
            margin: 2rem 0;
        }

        .empty-state i {
            font-size: 3rem;
            color: var(--gold);
            margin-bottom: 1rem;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--forest-green);
        }

        .empty-state p {
            color: #666;
            font-size: 0.95rem;
        }

        /* Responsive Breakpoints */
        @media (max-width: 968px) {
            .about-grid, .contact-grid {
                grid-template-columns: 1fr;
                gap: 3rem;
            }
            section {
                padding: 5rem 5%;
            }
        }

        @media (max-width: 768px) {
            header {
                padding: 1rem 5%;
            }
            .about-features {
                grid-template-columns: 1fr;
            }
            .footer-content {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <header id="header">
        <a href="#" class="logo-container">
            <div class="logo-badge">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="48" fill="#1b3a2b" stroke="#c5a059" stroke-width="2"/>
                    <circle cx="50" cy="50" r="40" fill="none" stroke="#c5a059" stroke-width="0.75" opacity="0.6"/>
                    <g transform="translate(50, 48) scale(0.65)" fill="#c5a059">
                        <path d="M0,-15 C5,-25 15,-20 10,-10 C20,-12 25,-2 15,2 C25,8 18,18 10,12 C5,22 -5,22 -10,12 C-18,18 -25,8 -15,2 C-25,-2 -20,-12 -10,-10 C-15,-20 -5,-25 0,-15 Z" fill="#dfc288"/>
                        <circle cx="0" cy="0" r="4" fill="#1b3a2b"/>
                        <path d="M-2,12 L-4,30 M2,10 L6,28 M0,15 L-1,25" stroke="#dfc288" stroke-width="2" fill="none"/>
                    </g>
                </svg>
            </div>
            <span class="brand-title">Orust Handelsträdgård</span>
        </a>
        <div class="header-actions">
            <button id="langToggle" class="lang-switch" onclick="toggleLanguage()">
                <i class="fa-solid fa-globe"></i> <span id="langText">ENGLISH</span>
            </button>
        </div>
    </header>

    <section class="hero" id="home">
        <div class="parallax-layer layer-bg" data-speed="0.2"></div>
        <div class="parallax-layer layer-mid" data-speed="0.5"></div>
        <div class="parallax-layer layer-fog" data-speed="0.8"></div>
